@for (breadcrumb of breadcrumbs$ | async; track breadcrumb.id) {
  <a
    puiHoverable
    [hoverableEnabled]="!breadcrumb.disabled"
    [routerLink]="['./']"
    [relativeTo]="breadcrumb.route"
    >
    <span [puiTooltip]="breadcrumb.tooltip">{{ breadcrumb.title }}</span>
  </a>
  @if (!$last) {
    <i>chevron_right</i>
  }
}
